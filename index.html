<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FamilyFinance - Quản Lý Chi Tiêu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Giữ lại style nền cố định ở đây để tránh giật lag khi React render */
        .aurora-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: -1; background: #f8fafc; }
        .blob { position: absolute; filter: blur(80px); opacity: 0.4; border-radius: 50%; animation: move 20s infinite alternate; }
        .blob-1 { width: 500px; height: 500px; background: #818cf8; top: -100px; left: -100px; }
        .blob-2 { width: 400px; height: 400px; background: #c084fc; bottom: -50px; right: -50px; animation-delay: -5s; }
        .blob-3 { width: 300px; height: 300px; background: #60a5fa; top: 20%; right: 10%; animation-delay: -10s; }
        @keyframes move { from { transform: translate(0, 0) scale(1); } to { transform: translate(50px, 100px) scale(1.1); } }
        .grid-pattern { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(circle at 2px 2px, #cbd5e1 1px, transparent 0); background-size: 32px 32px; opacity: 0.2; pointer-events: none; z-index: -1; }
        body { margin: 0; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="antialiased text-slate-900">
    <div class="aurora-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="grid-pattern"></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/index.tsx"></script>
</body>
</html>
